<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d1622">
<title>for Irene</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
  /* Layout: one 9:16 film centred on the bouquet's plum ground, a single quiet italic control beneath it */
  :root {
    --plum-top: #2a2030;
    --plum-mid: #1d1622;
    --plum-low: #110d15;
    --plum-glow: rgba(150, 105, 135, 0.30);
    --ink: #f2dce1;
    --ink-soft: rgba(242, 220, 225, 0.62);
    --rose-ink: #6e3d4a;
    --film-bg: #1b1a1e;
    --card-top: #fbf4ef;
    --card-mid: #f6e8e6;
    --card-low: #ecd9db;
    --card-glow: rgba(255, 255, 255, 0.85);
    --rose-soft: rgba(110, 61, 74, 0.55);
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background-color: var(--plum-low);
    background:
      radial-gradient(ellipse 70% 55% at 50% 46%, var(--plum-glow), transparent 70%),
      linear-gradient(180deg, var(--plum-top) 0%, var(--plum-mid) 55%, var(--plum-low) 100%);
    color: var(--ink);
    font-family: var(--serif);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .stage {
    position: relative;
    flex: none;
    max-width: 100%;
    border-radius: 14px;
    overflow: hidden;
    background: var(--film-bg);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.05);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .end {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.8s ease;
  }
  .end.on { opacity: 1; }
  .end h1 {
    margin: 0;
    font-weight: 400;
    font-style: italic;
    color: var(--rose-ink);
    font-size: calc(var(--sw, 400px) * 0.13);
    letter-spacing: 0.02em;
    transform: translateY(6px);
    position: relative;
    transition: transform 2.4s cubic-bezier(0.45, 0, 0.2, 1);
  }
  .end.on h1 { transform: none; }
  .end::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 2.4s ease;
    background:
      radial-gradient(ellipse 85% 42% at 50% 52%, var(--card-glow), transparent 70%),
      linear-gradient(180deg, var(--card-top) 0%, var(--card-mid) 55%, var(--card-low) 100%);
  }
  .end.flowers::before { opacity: 1; }
  #bouquet {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    opacity: 0;
    transition: opacity 2s ease 0.3s;
    touch-action: none;
  }
  .end.flowers #bouquet { opacity: 1; pointer-events: auto; cursor: grab; }
  .end.flowers #bouquet:active { cursor: grabbing; }
  .end.flowers h1 { transform: translateY(calc(var(--sh, 700px) * -0.41)) scale(0.8); }
  .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 14px;
    margin: 0;
    text-align: center;
    font-style: italic;
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--rose-soft);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .end.flowers .hint { opacity: 1; transition-delay: 3s; }
  .end.flowers .hint.gone { opacity: 0; transition-delay: 0s; }
  .ctl {
    flex: none;
    font-family: var(--serif);
    font-style: italic;
    font-size: 19px;
    line-height: 1;
    color: var(--ink-soft);
    background: none;
    border: 0;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.3s ease;
  }
  .ctl:hover { color: var(--ink); }
  .ctl:focus-visible { outline: 1px solid var(--ink-soft); outline-offset: 2px; }
  html.bare .wrap { padding: 0; gap: 0; }
  html.bare .ctl { display: none; }
  html.bare .stage { border-radius: 0; box-shadow: none; }
</style>
</head>
<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<div class="wrap" id="wrap">
  <div class="stage" id="stage" role="img" aria-label="An animation: two people hug in a gray parking lot, he lifts her and spins her, and with each turn the lot turns into a sunny meadow until they fall into the grass and the frame fills with light.">
    <canvas id="film"></canvas>
    <div class="end" id="end">
      <canvas id="bouquet" aria-label="A bouquet of pink lilies, pink peonies, white hydrangeas and baby's breath, wrapped in kraft paper and tied with a pink ribbon, turning slowly."></canvas>
      <h1>for Irene</h1>
      <p class="hint" id="hint">drag to turn</p>
    </div>
  </div>
  <button class="ctl" id="ctl" type="button">pause</button>
</div>

<script>
(() => {
'use strict';
/* ================= helpers ================= */
const W = 720, H = 1280, END = 19;
const LAND_T = 14.75, FEET_X = 548, LAND_Y = 1092;   // where and when they come down in the grass
const qs = new URLSearchParams(location.search);
const FREEZE = qs.has('freeze') ? parseFloat(qs.get('freeze')) : null;
if (qs.has('bare')) document.documentElement.classList.add('bare');

const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const eio = t => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453123; return x - Math.floor(x); };
const hermite = (p0, p1, m0, m1, u) => { const u2 = u * u, u3 = u2 * u; return (2*u3 - 3*u2 + 1) * p0 + (u3 - 2*u2 + u) * m0 + (-2*u3 + 3*u2) * p1 + (u3 - u2) * m1; };
function keys(t, k) {
  if (t <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t <= k[i][0]) { const a = k[i-1], b = k[i]; return lerp(a[1], b[1], ss(a[0], b[0], t)); }
  return k[k.length - 1][1];
}
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rgbCache = new Map();
function rgb(h) { let v = rgbCache.get(h); if (!v) { v = [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)]; rgbCache.set(h, v); } return v; }
function mix(a, b, t, al = 1) { const A = rgb(a), B = rgb(b); t = clamp(t); return `rgba(${A[0]+(B[0]-A[0])*t|0},${A[1]+(B[1]-A[1])*t|0},${A[2]+(B[2]-A[2])*t|0},${al})`; }
function rgba(h, a) { const A = rgb(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }

/* ================= canvases ================= */
const stage = document.getElementById('stage');
const cv = document.getElementById('film');
const ctx = cv.getContext('2d');
const mk = () => document.createElement('canvas');
const meadowC = mk(), charC = mk(), ghostC = mk(), edgeC = mk();
const h2 = mk(), h4 = mk(), h8 = mk(), h8b = mk();
const mctx = meadowC.getContext('2d'), cctx = charC.getContext('2d'), gctx = ghostC.getContext('2d'), ectx = edgeC.getContext('2d');
let K = 1, quality = 0, slowEMA = 0.016, slowCount = 0;

function size() {
  const wrap = document.getElementById('wrap');
  const bare = document.documentElement.classList.contains('bare');
  const cs = getComputedStyle(wrap);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  const ctlH = bare ? 0 : document.getElementById('ctl').offsetHeight + 12;
  const availW = wrap.clientWidth - padX, availH = wrap.clientHeight - padY - ctlH;
  const h = Math.max(160, Math.min(availH, availW * 16 / 9)), w = h * 9 / 16;
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  stage.style.setProperty('--sw', w + 'px'); stage.style.setProperty('--sh', h + 'px');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const pw = Math.round(Math.min(w * dpr, [960, 760, 560][quality]));
  K = pw / W;
  const ph = Math.round(H * K);
  for (const c of [cv, meadowC, charC, ghostC, edgeC]) { c.width = pw; c.height = ph; }
  h2.width = Math.ceil(pw / 2); h2.height = Math.ceil(ph / 2);
  h4.width = Math.ceil(pw / 4); h4.height = Math.ceil(ph / 4);
  h8.width = h8b.width = Math.ceil(pw / 8); h8.height = h8b.height = Math.ceil(ph / 8);
  dirty = true;
}
// soft blur by stepping down in halves; result lands in h8 (and h4)
function down(src) {
  const a = h2.getContext('2d'), b = h4.getContext('2d'), c = h8.getContext('2d');
  a.setTransform(1,0,0,1,0,0); a.globalCompositeOperation = 'copy'; a.drawImage(src, 0, 0, h2.width, h2.height);
  b.setTransform(1,0,0,1,0,0); b.globalCompositeOperation = 'copy'; b.drawImage(h2, 0, 0, h4.width, h4.height);
  c.setTransform(1,0,0,1,0,0); c.globalCompositeOperation = 'copy'; c.drawImage(h4, 0, 0, h8.width, h8.height);
  a.globalCompositeOperation = b.globalCompositeOperation = c.globalCompositeOperation = 'source-over';
  return h8;
}

/* textures */
function tile(w, h, fn) { const c = mk(); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }
const grainTile = tile(256, 256, (g, w, h) => {
  const im = g.createImageData(w, h), r = rng(3);
  for (let i = 0; i < w * h; i++) { const v = 128 + (r() - 0.5) * 180; im.data[i*4] = im.data[i*4+1] = im.data[i*4+2] = v; im.data[i*4+3] = 255; }
  g.putImageData(im, 0, 0);
});
const asphaltTile = tile(200, 200, (g, w, h) => {
  const r = rng(11);
  for (let i = 0; i < 900; i++) { g.fillStyle = r() < 0.5 ? 'rgba(40,40,44,0.22)' : 'rgba(255,255,255,0.16)'; const s = 0.6 + r() * 1.6; g.fillRect(r() * w, r() * h, s, s); }
});
const grassTile = tile(160, 120, (g, w, h) => {
  const r = rng(21);
  for (let i = 0; i < 260; i++) {
    const x = r() * w, y = r() * h, l = 4 + r() * 9;
    g.strokeStyle = r() < 0.5 ? 'rgba(60,110,40,0.35)' : 'rgba(200,225,120,0.30)';
    g.lineWidth = 0.8 + r(); g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * 4, y - l); g.stroke();
  }
});
let grainPat = null, asphaltPat = null, grassPat = null;

/* ================= timing ================= */
const HUG_YAW = -104;
const V0 = 1080 * 0.35 / 5, V1 = 1080 * (0.35 + 1.3) / 5;
function thetaAt(t) {
  if (t < 3) return HUG_YAW + 4 * Math.sin(t * 2 * Math.PI / 1.7) * (1 - ss(2.3, 3, t));
  if (t < 5) return hermite(HUG_YAW, 0, 0, V0 * 2, (t - 3) / 2);
  if (t < 10) { const u = (t - 5) / 5; return 1080 * (0.35 * u + 0.65 * u * u); }
  if (t < 13) return hermite(1080, 1800, V1 * 3, 0, (t - 10) / 3);
  return 1800;
}
// dream time: now and then a frame is held a little too long, then time skips ahead
const HOLDS = [[6.35, 0.12], [7.85, 0.1], [8.8, 0.15], [9.7, 0.09], [10.7, 0.13], [12.2, 0.14]];
function dreamTime(t) { for (const [a, h] of HOLDS) if (t >= a && t < a + h) return a; return t; }

function state(t) {
  const S = { t };
  S.th = thetaAt(t);
  S.om = (thetaAt(t + 0.03) - thetaAt(t - 0.03)) / 0.06;
  S.spin = clamp(S.om / 330) * ss(4.4, 5.2, t);
  S.g1 = clamp(S.th / 360); S.g2 = clamp((S.th - 360) / 360); S.g3 = clamp((S.th - 720) / 360);
  S.L = ss(3, 5, t);
  S.detail = t < 3 ? 1 : t < 5 ? lerp(1, 0.85, (t - 3) / 2) : t < 10 ? lerp(0.85, 0.4, (t - 5) / 5) : t < 13 ? lerp(0.4, 0.25, (t - 10) / 3) : lerp(0.25, 0, clamp((t - 13) / 5.2));
  const thR = S.th * Math.PI / 180;
  // he is never quite balanced: the pivot circles under them, then her momentum walks him off to the side
  S.stag = ss(12.2, 12.8, t) * (1 - ss(13.75, 13.95, t));
  S.ax = keys(t, [[0, 258], [3, 258], [5, 360], [11.0, 360], [13.9, FEET_X]]) + 6 * Math.sin(t * 2 * Math.PI / 1.7) * (1 - ss(2.3, 3, t))
    + 13 * Math.sin(thR + 0.6) * S.spin + 9 * Math.sin((t - 12.2) * 7.5) * S.stag;
  S.fy = keys(t, [[0, 1268], [3, 1268], [5, 1210], [9.6, 1105], [12.4, 1185], [13.9, LAND_Y]]) + 5 * Math.cos(thR) * S.spin;
  S.s = keys(t, [[0, 4.55], [3, 4.55], [5, 4.3], [9.4, 3.65], [12.4, 4.6], [13.9, 3.3]]);
  S.lift = keys(t, [[4.0, 0], [4.8, 30], [11.6, 30], [12.6, 22], [14.3, 22], [15.3, 6]]);
  S.knee = keys(t, [[3.2, 0], [3.8, 14], [4.4, 14], [4.9, 3], [12.5, 3], [13.0, 0]]);
  S.hand = ss(3.3, 4.2, t); S.arm = ss(3.5, 4.3, t); S.kiss = ss(3.7, 4.6, t);
  S.lean = keys(t, [[0, 18], [3.6, 18], [4.8, -5], [11.8, -5], [12.6, 2]]) - 6 * S.spin;
  // roll in the picture plane (+ tips toward the right): sway while spinning, stumble forward, over-correct, and go over backward
  const wob = 2.6 * Math.sin(thR + 1.7) * S.spin + 5.5 * Math.sin((t - 12.2) * 7.5 + 1) * S.stag;
  const pre = keys(t, [[13.1, 0], [13.5, 9], [13.85, -7]]);
  S.roll = t < 13.85 ? wob + pre : t < LAND_T ? lerp(-7, -91, Math.pow((t - 13.85) / (LAND_T - 13.85), 2.1)) : -90 - 3 * Math.cos((t - LAND_T) * 13) * Math.exp(-(t - LAND_T) * 6);
  S.fall = 0;
  S.sink = keys(t, [[14.6, 0], [14.95, -12]]);
  S.unwrap = ss(13.95, 14.6, t);                       // her legs come off his side as they go over
  S.kick = ss(LAND_T + 0.45, LAND_T + 1.7, t);         // then, lying on him, she bends her knees and her feet come up
  S.charA = 1 - ss(17.0, 18.0, t);
  S.zoom = keys(t, [[3.5, 1], [4.9, 1.34], [5.5, 1.34], [6.9, 1], [9.6, 1], [12.2, 1.3], [12.7, 1.3], [13.8, 1], [15.0, 1], [16.4, 1.12]]);
  S.tilt = 330 * eio((t - 16.0) / 2.8);
  S.orbit = 150 * eio((t - 5) / 8.5);
  const sp = ss(5, 10.2, t);
  S.sunX = lerp(650, 396, sp); S.sunY = lerp(120, 330, sp);
  S.tallG = ss(9.3, 11.8, t);
  S.impact = ss(LAND_T - 0.22, LAND_T + 0.06, t) * (1 - ss(LAND_T + 0.3, LAND_T + 1.8, t));   // the grass gives under them, then springs back
  S.nest = ss(LAND_T - 0.1, LAND_T + 0.2, t);
  S.lush = ss(LAND_T + 0.2, LAND_T + 2.2, t);                                                    // and closes over them, tall
  S.vort = ss(5.3, 7.2, t) * (1 - ss(12.6, 13.6, t));
  S.ghost = ss(5.6, 7.0, t) * (1 - ss(11.4, 12.8, t));
  S.rim = ss(6.5, 10, t);
  S.wash = ss(17.0, 18.5, t);
  S.frame = Math.floor(t * 9);
  return S;
}
const fadeAt = (S, th) => ss(th - 0.04, th + 0.04, S.detail);
// how far the transformation wave has reached a point (waves ripple out from their feet)
function rip(S, g, x, y) {
  if (g <= 0) return 0; if (g >= 1) return 1;
  const d = Math.hypot(x - S.ax, (y - S.fy) / 0.62);
  return ss(-150, 150, g * 1950 - d);
}
function cam(c, S) { const z = S.zoom, zy = 560; c.setTransform(K * z, 0, 0, K * z, K * (360 - 360 * z), K * (zy - zy * z + S.tilt)); }

/* ================= line work ================= */
// outline style that boils, breaks up and fades as detail drops
function lineStyle(S) {
  const d = S.detail;
  return {
    a: ss(0.3, 0.8, d),
    boil: lerp(0, 3.2, ss(0.97, 0.55, d)),
    dash: d < 0.66 ? [lerp(40, 5, ss(0.66, 0.35, d)), lerp(1, 16, ss(0.66, 0.35, d))] : null,
    f: S.frame
  };
}
const jit = (ls, i) => (hash(i * 13.37 + ls.f * 7.13) - 0.5) * ls.boil;
// stroke a polygon outline with hand-drawn wobble
function inkPoly(c, ls, pts, closed = true, seed = 0, w = 1.5) {
  if (ls.a < 0.02) return;
  c.save();
  c.strokeStyle = `rgba(28,24,30,${0.8 * ls.a})`; c.lineWidth = w; c.lineJoin = 'round'; c.lineCap = 'round';
  if (ls.dash) c.setLineDash(ls.dash);
  c.beginPath();
  const n = pts.length, m = closed ? n : n - 1;
  let id = seed * 101;
  c.moveTo(pts[0][0] + jit(ls, id++), pts[0][1] + jit(ls, id++));
  for (let i = 0; i < m; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    const steps = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 26));
    for (let s = 1; s <= steps; s++) { const u = s / steps; c.lineTo(lerp(a[0], b[0], u) + jit(ls, id++), lerp(a[1], b[1], u) + jit(ls, id++)); }
  }
  c.stroke(); c.restore();
}
function fillPoly(c, pts, fill) { c.fillStyle = fill; c.beginPath(); c.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]); c.closePath(); c.fill(); }
function rr(x, y, w, h, r) { return [[x + r, y], [x + w - r, y], [x + w, y + r], [x + w, y + h - r], [x + w - r, y + h], [x + r, y + h], [x, y + h - r], [x, y + r]]; }
function blob(c, cx, cy, r, cols, seed, n = 7, squash = 0.8) {
  const R = rng(seed);
  for (let i = 0; i < n; i++) {
    const a = R() * Math.PI * 2, d = R() * r * 0.55, rr2 = r * (0.42 + R() * 0.35);
    c.fillStyle = cols[i % cols.length];
    c.beginPath(); c.ellipse(cx + Math.cos(a) * d, cy + Math.sin(a) * d * squash - r * 0.1, rr2, rr2 * 0.92, 0, 0, Math.PI * 2); c.fill();
  }
}
function flower(c, x, y, r, col, rot = 0) {
  c.fillStyle = col;
  for (let i = 0; i < 5; i++) { const a = rot + i * 1.2566; c.beginPath(); c.arc(x + Math.cos(a) * r * 0.62, y + Math.sin(a) * r * 0.62, r * 0.52, 0, 6.2832); c.fill(); }
  c.fillStyle = '#E9B53F'; c.beginPath(); c.arc(x, y, r * 0.36, 0, 6.2832); c.fill();
}

/* ================= pre-generated scenery ================= */
const R0 = rng(5);
const tufts = Array.from({ length: 46 }, () => { const y = lerp(510, 1290, Math.pow(R0(), 0.85)); return { x: -20 + R0() * 760, y, n: 3 + (R0() * 4 | 0), s: R0(), seed: R0() * 1000 | 0 }; });
const lines = [0, 1, 2, 3].map(i => ({ x0: 36 + i * 92, y0: 548, x1: -40 + i * 92, y1: 720 }));
const FLC = ['#F6D35B', '#FFF7EA', '#F4A9C0', '#F8C9D6', '#FFE89A'];
const meadowFlowers = Array.from({ length: 300 }, () => { const y = lerp(480, 1320, Math.pow(R0(), 1.3)); return { x: -200 + R0() * 1120, y, c: FLC[R0() * FLC.length | 0], r: R0() }; });
const backProps = Array.from({ length: 14 }, (_, i) => ({ x: -160 + i * 78 + R0() * 50, y: 410 + R0() * 50, k: R0() < 0.55 ? 'tree' : 'bush', r: 0.7 + R0() * 0.6, seed: 900 + i * 17 }));

      }
    }
  });

function taper(c, ax, ay, bx, by, ra, rb, hem) {

/* ================= particles in front ================= */
function drawFront(c, S) {
  drawVortex(c, S, true);

  const t = S.t;
  // the puff of petals and seeds as they land, all along where they lie

    const dt = t - LAND_T + 0.05;
    for (let i = 0; i < 64; i++) {
      const a = -Math.PI * (0.12 + 0.76 * hash(i * 3.3)), v = 110 + 250 * hash(i * 5.1);
      const isSeed = i % 3 === 0;
      const drag = 1 - Math.exp(-dt * 2.2);
      const x = FEET_X - 60 - 520 * hash(i * 9.7) + Math.cos(a) * v * drag / 2.2 + Math.sin(t * 2 + i) * 10;
      const y = LAND_Y - 30 + Math.sin(a) * v * drag / 2.2 + (isSeed ? -dt * 38 : dt * dt * 36);
      const al = clamp(dt * 6) * (1 - ss(1.5, 3.4, dt));
      if (al <= 0) continue;
      c.globalAlpha = al;

      else { c.fillStyle = FLC[i % FLC.length]; c.beginPath(); c.ellipse(x, y, 5.5, 3, t * 3 + i, 0, 6.2832); c.fill(); }
    }
    c.globalAlpha = 1;
  }
  // seeds drifting up toward the sun
  if (t > LAND_T + 0.4) {
    for (const sd of seedsUp) {
      const u = clamp((t - LAND_T - 0.4 - sd.d) / (3.3 * sd.sp)); if (u <= 0) continue;
      const e = 1 - Math.pow(1 - u, 1.6);
      const x = lerp(FEET_X - 290 + sd.dx * 1.6, S.sunX + sd.dx * 0.25, e) + Math.sin(t * 1.3 + sd.ph) * 26 * (1 - e * 0.5);
      const y = lerp(LAND_Y - 60, S.sunY + 20, e);
      c.globalAlpha = Math.sin(u * Math.PI) * 0.95;

    c.globalAlpha = 1;

}

/* ================= light and the dream ================= */
function drawLight(c, S) {
  const t = S.t;
  // the first sunbeam

    const sx = S.sunX, sy = S.sunY;
    const g = c.createLinearGradient(sx, sy, S.ax - 60, 1250);

    c.restore();

    for (const m of motes) {

      c.beginPath(); c.arc(x, y, m.s, 0, 6.2832); c.fill();
      if (m.sp) { c.strokeStyle = `rgba(255,246,220,${0.8 * ma * tw})`; c.lineWidth = 1; c.beginPath(); c.moveTo(x - 7 * tw, y); c.lineTo(x + 7 * tw, y); c.moveTo(x, y - 7 * tw); c.lineTo(x, y + 7 * tw); c.stroke(); }
    }

  }

/* ================= one frame ================= */

      const wa = b.obj.body.m / (a.obj.body.m + b.obj.body.m), wb = 1 - wa;
      a.rz += _d.dot(a.ex) * wa / ca.y; a.rx -= _d.dot(a.ez) * wa / ca.y;
      b.rz -= _d.dot(b.ex) * wb / cb.y; b.rx += _d.dot(b.ez) * wb / cb.y;
      a.vx *= 0.85; a.vz *= 0.85; b.vx *= 0.85; b.vz *= 0.85;
    }
  }
  for (const h of heads) {
    h.rx = Math.max(-0.3, Math.min(0.3, h.rx)); h.rz = Math.max(-0.3, Math.min(0.3, h.rz));
    h.g.rotation.x = h.rx; h.g.rotation.z = h.rz;
  }
}

/*
  A florist's dome: one peony crowning the top, an inner ring of peonies and lilies,
  an outer ring where hydrangeas give the mass, baby's breath in every gap.
  Azimuth PI/2 faces the camera at load.
*/
const TAU = Math.PI * 2;
const F = Math.PI / 2;
// crown peony
addHead(makePeony(1.3), sph(F + 0.3, 0.12, 1.12), -1.9, 0.028, 0.02);
// inner ring
[['peony', 0.0], ['lily', 1], ['peony', 2], ['lily', 3], ['peony', 4]].forEach(([kind, i]) => {
  const az = F + 0.25 + i * TAU / 5 + rr(-0.1, 0.1);
  if (kind === 'peony') addHead(makePeony(rr(1.2, 1.3)), sph(az, 0.64, 1.1), -1.5, 0.028, 0.02);
  else addHead(makeLily(1.45), sph(az, 0.58, 1.4), -0.9, 0.025, 0.028);
});
// outer ring
['hydr', 'peony', 'hydr', 'lily', 'hydr', 'peony', 'hydr'].forEach((kind, i) => {
  const az = F + 0.2 + TAU / 14 + i * TAU / 7 + rr(-0.06, 0.06);
  if (kind === 'hydr') addHead(makeHydrangea(rr(0.37, 0.4)), sph(az, 1.2, 0.98), -0.35, 0.022, 0.014);
  else if (kind === 'peony') addHead(makePeony(rr(1.12, 1.2)), sph(az, 1.1, 1.12), -0.7, 0.028, 0.02);
  else addHead(makeLily(1.4), sph(az, 1.0, 1.36), -0.3, 0.025, 0.028);
});
// lily buds standing above the dome
[[F + 1.2, 0.22, 1.72, 1.1], [F + 3.6, 0.3, 1.66, 1.0], [F + 5.3, 0.42, 1.6, 0.95]].forEach(([az, pol, r, s]) =>
  addHead(makeLilyBud(s), sph(az, pol, r), -1.4, 0.016, 0.04));
// baby's breath: clouds in the gaps of both rings and a few floating over the top
for (let i = 0; i < 5; i++) addHead(makeGyp(0.2), sph(F + 0.25 + (i + 0.5) * TAU / 5, rr(0.5, 0.62), 1.15), -1.5, 0.008, 0.05);
for (let i = 0; i < 7; i++) addHead(makeGyp(0.19), sph(F + 0.2 + TAU / 14 + (i + 0.5) * TAU / 7, rr(0.95, 1.05), 1.05), -0.8, 0.008, 0.05);
for (let i = 0; i < 4; i++) addHead(makeGyp(0.22), sph(F + 0.9 + i * TAU / 4, rr(0.22, 0.32), 1.2), -1.6, 0.008, 0.05);
for (let i = 0; i < 7; i++) addHead(makeGyp(0.17), sph(F + 0.2 + i * TAU / 7 + rr(-0.15, 0.15), rr(0.78, 0.86), 1.12), -1.0, 0.008, 0.05);

// Leaves: a collar around the rim and a few tucked between flowers
const leaves = [];
function addLeaf(pos, outward, elev, L, W, curl, pal) {
  const g = leafGeometry(L, W, curl, pal);
  const m = new THREE.Mesh(g, mat.leaf);
  m.castShadow = m.receiveShadow = true;
  const azp = Math.atan2(outward.x, outward.z);
  m.position.copy(pos);
  m.rotation.set(-elev, azp, rr(-0.25, 0.25), 'YXZ');
  bouquet.add(m);
  leaves.push({ m, elev, ph: rand() * 6.28, f: rr(0.8, 1.3), delay: rr(0, 0.5) });
}
for (let i = 0; i < 16; i++) {
  const a = i * Math.PI * 2 / 16 + rr(-0.12, 0.12);
  const out = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
  const pos = out.clone().multiplyScalar(rr(0.8, 0.9)).setY(rr(-0.05, 0.08));
  addLeaf(pos, out, rr(0.0, 0.35), rr(0.8, 1.0), rr(0.13, 0.17), rr(-1.0, -0.5), LEAF_PALETTES[i % 3 === 2 ? 2 : i % 2]);
}
for (let i = 0; i < 7; i++) {
  const a = F + 0.2 + i * TAU / 7 + rr(-0.1, 0.1);
  const out = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
  const pos = sph(a, rr(0.8, 0.9), 0.9);
  addLeaf(pos, out, rr(0.5, 0.8), rr(0.5, 0.62), rr(0.11, 0.14), rr(-0.7, -0.3), LEAF_PALETTES[i % 2]);
}

for (let i = 0; i < 7; i++) {
  const a = F + 0.2 + TAU / 14 + (i + 0.5) * TAU / 7 + rr(-0.12, 0.12);
  const out = new THREE.Vector3(Math.cos(a), 0, Math.sin(a));
  addLeaf(sph(a, rr(1.05, 1.15), 0.8), out, rr(0.25, 0.5), rr(0.55, 0.7), rr(0.13, 0.17), rr(-0.8, -0.4), LEAF_PALETTES[(i + 1) % 3]);
}

buildHeads();

// Stems, one draw call
const stemMesh = new THREE.Mesh(mergeGeometries(stemGeos), mat.stem);
stemMesh.castShadow = true; stemMesh.receiveShadow = true;
bouquet.add(stemMesh);

/* ---------- wrapping paper ---------- */
function paperSheet(azC, span, H, peak, rTop, layerOff, cA, cB) {
  const yBot = -1.08, rBot = 0.12;
  const colA = C(cA), colB = C(cB);
  return buildGrid(30, 16, (u, v, p, c) => {
    const th = azC + (u - 0.5) * span;
    const tip = Math.pow(1 - Math.abs(2 * u - 1), 1.4);
    const h = H + peak * tip;
    const y = yBot + v * h;
    const t = (v * h) / (H + peak);
    let r = rBot + (rTop - rBot) * Math.pow(t, 1.5) + layerOff * t;
    r += 0.035 * Math.sin(th * 7 + v * 2) * t + 0.006 * Math.sin(th * 31 + v * 13);
    r += 0.14 * Math.pow(v, 4) * tip;
    p.set(r * Math.cos(th), y, r * Math.sin(th));
    c.copy(colA).lerp(colB, smooth(v));
    c.multiplyScalar(0.94 + 0.06 * Math.sin(th * 29 + v * 11));
  });
}
const sheets = [];
for (let i = 0; i < 5; i++) sheets.push(paperSheet(i * TAU / 5 + 0.3, 1.9, 1.1, 0.42, 1.26, 0.03 + i * 0.014, '#a47a4e', '#d4b189'));
for (let i = 0; i < 5; i++) sheets.push(paperSheet(i * TAU / 5 + 0.93, 1.6, 1.1, 0.5, 1.14, -0.06 + i * 0.012, '#e8c9c4', '#f6e3df'));
const paper = new THREE.Mesh(mergeGeometries(sheets), mat.paper);
paper.castShadow = true; paper.receiveShadow = true;
bouquet.add(paper);

/* ---------- ribbon and bow ---------- */
const ribbon = new THREE.Group();
ribbon.position.copy(BIND);
bouquet.add(ribbon);
{
  const band = buildGrid(48, 2, (u, v, p, c) => {
    const th = u * Math.PI * 2;
    const r = 0.182 + 0.004 * Math.sin(th * 9);
    p.set(r * Math.cos(th), (v - 0.5) * 0.095, r * Math.sin(th));
    c.set('#ffffff');
  });
  const parts = [band];
  const F = new THREE.Vector3(0, 0, 0.19);
  for (const sgn of [1, -1]) {
    const loop = buildGrid(36, 3, (u, v, p, c) => {
      const phi = u * Math.PI * 2;
      const a = 0.15, cz = 0.045;
      const x = sgn * (a - a * Math.cos(phi));
      const z = cz * Math.sin(phi) + 0.015 * Math.sin(phi * 2);
      const w = 0.09 * (0.35 + 0.65 * Math.sin(Math.PI * u));
      const yy = (v - 0.5) * w;
      p.set(F.x + x, F.y + yy + Math.abs(x) * 0.42, F.z + z + 0.02);
      c.set('#ffffff');
    });
    parts.push(loop);
    const tail = buildGrid(3, 18, (u, v, p, c) => {
      const w = 0.075 * (1 - 0.15 * v);
      const along = v * 0.46 * (1 - 0.16 * (sgn > 0 ? u : 1 - u) * v);
      p.set(F.x + sgn * (0.025 + 0.13 * along) + (u - 0.5) * w * 0.95,
        F.y - along + (u - 0.5) * w * 0.3 * sgn,
        F.z + 0.025 + 0.025 * Math.sin(along * 9 + sgn));
      c.set('#ffffff');
    });
    parts.push(tail);
  }
  const knot = colorize(new THREE.SphereGeometry(0.038, 14, 10).scale(1.15, 1, 0.75).translate(F.x, F.y + 0.005, F.z + 0.02), '#ffffff');
  parts.push(knot);
  parts.forEach((g) => { if (!g.getAttribute('normal')) g.computeVertexNormals(); });
  const rMesh = new THREE.Mesh(mergeGeometries(parts.map((g) => { g.deleteAttribute('color'); return g; })), mat.ribbon);
  rMesh.castShadow = true;
  ribbon.add(rMesh);
}

/* ---------- drifting petals ---------- */
const falling = [];
if (!reduceMotion) {
  for (let i = 0; i < 7; i++) {
    const pink = i % 3 !== 0;
    const base = C(pink ? '#e0668c' : '#f3f4e6'), tipC = C(pink ? '#f6b6c8' : '#fdfcf6');
    const g = petalGeometry({ L: pink ? 0.17 : 0.2, W: pink ? 0.11 : 0.06, a: pink ? 0.42 : 0.5, b: pink ? 0.32 : 0.8, cup: 0.5, curl: pink ? 0.8 : -0.6,
      curlPow: 1.2, ruffle: 0.006, rufFreq: 9, seed: i, nu: 6, nv: 6, color: (uu, v, c) => c.copy(base).lerp(tipC, v) });
    g.translate(0, 0, -0.08);
    const m = new THREE.Mesh(g, pink ? mat.peony : mat.lily);
    m.visible = false;
    scene.add(m);
    falling.push({ m, start: 3.2 + i * 2.1, v: 0, ph: 0, spin: new THREE.Vector3(), active: false });
  }
}
function resetPetal(f) {
  const a = rand() * 6.28, r = rr(1.3, 2.0);
  f.m.position.set(Math.cos(a) * r, 2.6, Math.sin(a) * r);
  f.v = rr(0.13, 0.2);
  f.ph = rand() * 6.28;
  f.spin.set(rr(-1, 1), rr(-1, 1), rr(-1, 1)).multiplyScalar(1.1);
  f.active = true;
  f.m.visible = true;
}

/* ---------- camera fit ---------- */
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.autoRotate = !reduceMotion;
controls.autoRotateSpeed = 1.1;
controls.rotateSpeed = 0.6;
controls.minPolarAngle = 0.95;
controls.maxPolarAngle = 1.78;

const BOUNDS = { top: Math.max(1.9, extent.top + 0.05), bottom: -2.18, hw: Math.max(1.8, extent.hw + 0.08) };
let fitted = false;
function fit() {
  const w = stageEl.clientWidth, h = stageEl.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  // Fit the bouquet between NDC -0.93 (bottom) and 0.70 (top), leaving the top strip for the title.
  const H = Math.max((BOUNDS.top - BOUNDS.bottom) / 1.63, BOUNDS.hw / (0.92 * camera.aspect));
  const d = H / tanH;
  const ty = (BOUNDS.top + BOUNDS.bottom) / 2 + 0.115 * H;
  controls.target.set(0, ty, 0);
  key.target.position.set(0, ty, 0);
  rim.target.position.set(0, ty, 0);
  fill.target.position.set(0, ty, 0);
  rim.position.set(2.5, 3.2, -2 * d);
  controls.minDistance = d * 0.55;
  controls.maxDistance = d * 1.5;
  if (!fitted) {
    const el = THREE.MathUtils.degToRad(11);
    camera.position.set(0, ty + Math.sin(el) * d, Math.cos(el) * d);
    fitted = true;
  } else {
    const dir = camera.position.clone().sub(controls.target).normalize();
    camera.position.copy(controls.target).addScaledVector(dir, d);
  }
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', fit);
fit();

/* ---------- hint ---------- */
const hint = document.getElementById('hint');
const hideHint = () => hint.classList.add('gone');
canvas.addEventListener('pointerdown', hideHint, { once: true });
setTimeout(hideHint, 9000);

/* ---------- loop ---------- */
const clock = new THREE.Clock();
let t = 0;
let perfFrames = 0, perfTime = 0, perfChecked = false;
const motion = reduceMotion ? 0.25 : 1;

function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!window.__bouquet.on) { requestAnimationFrame(frame); return; }
  t += dt;
  tick(dt);
  requestAnimationFrame(frame);
}
function tick(dt) {
  const bt = reduceMotion ? 100 : t - 0.3;

  for (const a of animated) a.update(t, bt, dt);

  const gust = 0.65 + 0.35 * Math.sin(t * 0.31) + 0.15 * Math.sin(t * 0.83 + 1.3);
  stepHeads(dt, gust);
  for (const l of leaves) {
    const b = smooth((bt - l.delay) / 1.4);
    l.m.rotation.x = -(l.elev * lerp(1.9, 1, b)) + 0.05 * motion * gust * Math.sin(t * 1.1 * l.f + l.ph);
    l.m.scale.setScalar(lerp(0.5, 1, b));
  }
  bouquet.position.y = reduceMotion ? 0 : 0.03 * Math.sin(t * 0.5);

  for (const f of falling) {
    if (!f.active) { if (t > f.start) resetPetal(f); else continue; }
    const p = f.m.position;
    p.y -= f.v * dt;
    p.x += Math.sin(t * 0.7 + f.ph) * 0.12 * dt;
    p.z += Math.cos(t * 0.55 + f.ph) * 0.1 * dt;
    f.m.rotation.x += f.spin.x * dt;
    f.m.rotation.y += f.spin.y * dt;
    f.m.rotation.z += f.spin.z * dt;
    const s = smooth((2.6 - p.y) / 0.5) * smooth((p.y + 2.7) / 0.6);
    f.m.scale.setScalar(Math.max(0.001, s));
    if (p.y < -2.7) resetPetal(f);
  }

  controls.update(dt);
  renderer.render(scene, camera);

  // If a phone struggles once the bloom has settled, drop shadows and resolution.
  if (!perfChecked && t > 4.5) {
    perfFrames++; perfTime += dt;
    if (perfFrames >= 90) {
      perfChecked = true;
      if (perfTime / perfFrames > 1 / 42) {
        key.castShadow = false;
        dprCap = 1.25;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, dprCap));
        fit();
      }
    }
  }
}
requestAnimationFrame(frame);
}
</script>
</body>
